# Publie sur GitHub Pages le site deja compile et versionne dans site/ (tools/build_site.sh).
# Prerequis, une seule fois : Settings > Pages > Build and deployment > Source : "GitHub Actions".
# Les verifications (tests, notebooks, parcours) tournent en parallele et ne bloquent pas la publication.
name: Publication GitHub Pages

on:
  push:
    branches: [main, "ccr-**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@v4

  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docker/requirements.txt
      - name: Dependances Python (PyTorch CPU)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0
          pip install -r docker/requirements.txt
          pip install -e python
      - name: Tests unitaires
        run: cd python && python -m pytest -q
      - name: Donnees, traces, notebooks executes, paquet Python
        run: python tools/seed.py
        env:
          MPLBACKEND: Agg
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Controle complet du contenu pedagogique (25 lecons, questions, ateliers)
        run: |
          cd web && npm ci --no-audit --no-fund && cd ..
          node tools/verifier_contenu.cjs
      - name: Parcours de bout en bout du site versionne (Playwright)
        run: |
          mkdir -p /tmp/e2e && (cd /tmp/e2e && npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1.63.0 && npx playwright install --with-deps chromium)
          python -m http.server 4173 --bind 127.0.0.1 --directory site >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:4173/ && break; sleep 1; done
          NODE_PATH=/tmp/e2e/node_modules node tools/e2e.cjs http://127.0.0.1:4173
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures
          path: docs/captures
