# Verifie le projet (tests, notebooks, parcours du site) puis publie le site sur GitHub Pages.
# Prerequis, une seule fois : Settings > Pages > Build and deployment > Source : "GitHub Actions".
name: Publication GitHub Pages

on:
  push:
    branches: [main, "ccr-**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docker/requirements.txt
      - name: Dependances Python (PyTorch CPU)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0
          pip install -r docker/requirements.txt
          pip install -e python
      - name: Tests unitaires
        run: cd python && python -m pytest -q
      - name: Donnees, traces, notebooks executes, paquet Python
        run: python tools/seed.py
        env:
          MPLBACKEND: Agg
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Compilation du site
        run: cd web && npm ci --no-audit --no-fund && npm run
        env:
          VITE_DEPOT: ${{ github.repository }}
          VITE_BRANCHE: ${{ github.ref_name }}
      - name: Parcours de bout en bout (Playwright)
        run: |
          mkdir -p /tmp/e2e && (cd /tmp/e2e && npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1.49.1 && npx playwright install --with-deps chromium)
          (cd web && npx vite preview --port 4173 &) && sleep 4
          NODE_PATH=/tmp/e2e/node_modules node tools/e2e.cjs http://localhost:4173
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures
          path: docs/captures
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  publier:
    needs: construire
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
