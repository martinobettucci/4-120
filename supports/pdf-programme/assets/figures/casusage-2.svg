"77" stroke="#E07B1A" stroke-width="2"></line><polygon points="391,82 395,74 387,74" fill="#E07B1A"></polygon></g><g><rect x="250" y="82" width="182" height="40" rx="7" fill="#ffffff" stroke="#E07B1A" stroke-width="2"></rect><text x="341" y="100" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0d0d0d">Si le risque est élevé</text><text x="341" y="114" text-anchor="middle" font-size="10.5" fill="#556079">trois avis et un arbitre</text></g></g><g opacity="1"><text x="14" y="146" font-size="12.5" fill="#0d0d0d">Trois avis pour les 1 000 dossiers : <tspan font-weight="700">3 000 traitements</tspan></text><text x="14" y="168" font-size="12.5" fill="#0d0d0d">Trois avis pour les 250 dossiers à risque : <tspan font-weight="700" fill="#238C33">1 500 traitements</tspan></text><text x="14" y="190" font-size="12.5" fill="#0d0d0d">Erreurs sur ces 250 dossiers : <tspan font-weight="700">25 avec un avis, 7 avec trois</tspan></text></g><text x="220" y="218" text-anchor="middle" fill="#0d0d0d" font-size="13">Diffuser le risque seulement là où l&#x27;enjeu le justifie</text></svg>