<svg xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans" viewBox="0 0 440 230" role="img"><text x="14" y="22" fill="#0d0d0d" font-size="13" font-weight="700">Question : à combien l&#x27;aide est-elle plafonnée ?</text><rect x="60" y="62" width="320" height="64" rx="10" fill="#ffffff" stroke="#F24141" stroke-width="2"></rect><text x="220" y="88" text-anchor="middle" fill="#556079" font-size="12">Modèle de langage seul, sans le règlement</text><text x="220" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#0d0d0d">« Probablement 50 % du devis. »</text><text x="220" y="150" text-anchor="middle" font-size="12" fill="#F24141" font-weight="700">Réponse plausible, inventée, sans source</text><text x="220" y="216" text-anchor="middle" fill="#0d0d0d" font-size="13">Sans document, le modèle répond de mémoire</text></svg>