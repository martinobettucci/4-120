<svg xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans" viewBox="0 0 440 230" role="img"><text x="20" y="26" fill="#556079" font-size="12">Modération : 64 actions bloquées sur 1 000, dont 50 à risque</text><g><rect x="20" y="40" width="281.25" height="30" fill="#238C33"></rect><text x="160.625" y="60" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">45 bloquées à juste titre</text></g><g><rect x="301.25" y="40" width="118.75" height="30" fill="#F24141"></rect><text x="360.625" y="60" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">19 à tort</text></g><g opacity="1"><text x="20" y="104" font-size="12.5" fill="#0d0d0d">Blocages à juste titre : 45 / 64</text><text x="420" y="104" text-anchor="end" font-size="13" font-weight="700" fill="#0d0d0d">70 %</text></g><g opacity="1"><text x="20" y="130" font-size="12.5" fill="#0d0d0d">Faux positifs : 19 actions légitimes sur 950</text><text x="420" y="130" text-anchor="end" font-size="13" font-weight="700" fill="#0d0d0d">2 %</text></g><g opacity="1"><text x="20" y="156" font-size="12.5" fill="#0d0d0d">Incidents évités : 45 actions à risque sur 50</text><text x="420" y="156" text-anchor="end" font-size="13" font-weight="700" fill="#0d0d0d">90 %</text></g><text x="220" y="218" text-anchor="middle" fill="#0d0d0d" font-size="13">Un modérateur se juge aussi sur ce qu&#x27;il bloque à tort</text></svg>