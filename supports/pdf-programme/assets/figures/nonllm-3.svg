<svg xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans" viewBox="0 0 440 230" role="img"><text x="14" y="22" fill="#556079" font-size="12">Probabilité de fraude estimée par le modèle</text><g><rect x="20" y="60" width="80" height="34" fill="#238C33" opacity="0.35"></rect><text x="60" y="81" text-anchor="middle" font-size="11" font-weight="700" fill="#0D0D0D">Normal</text></g><g><rect x="100" y="60" width="199.99999999999997" height="34" fill="#D9CF4A" opacity="0.35"></rect><text x="199.99999999999997" y="81" text-anchor="middle" font-size="11" font-weight="700" fill="#0D0D0D">Contrôle complémentaire</text></g><g><rect x="300" y="60" width="120.00000000000001" height="34" fill="#F24141" opacity="1"></rect><text x="360" y="81" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Escalade immédiate</text></g><text x="100" y="112" text-anchor="middle" fill="#556079" font-size="12">seuil bas 0,20</text><text x="300" y="112" text-anchor="middle" fill="#556079" font-size="12">seuil haut 0,70</text><polygon points="360,58 354,44 366,44" fill="#0D0D0D"></polygon><text x="360" y="38" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0d0d0d">0,85</text><text x="220" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#0d0d0d">Action : escalade immédiate</text><text x="220" y="176" text-anchor="middle" fill="#556079" font-size="12">le modèle produit le score, la politique d&#x27;action fixe les seuils</text><text x="220" y="218" text-anchor="middle" fill="#0d0d0d" font-size="13">Agent statistique : un score seul ne décide rien</text></svg>