<svg xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans" viewBox="0 0 440 230" role="img"><text x="14" y="24" fill="#556079" font-size="12">Moteur d&#x27;allocation de tickets</text><g opacity="1"><g><rect x="14" y="36" width="180" height="46" rx="7" fill="#ffffff" stroke="#23468C" stroke-width="2"></rect><text x="104" y="57" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0d0d0d">Perception</text><text x="104" y="71" text-anchor="middle" font-size="10.5" fill="#556079">ticket reçu</text></g></g><g opacity="1"><g><rect x="246" y="36" width="180" height="46" rx="7" fill="#ffffff" stroke="#23468C" stroke-width="2"></rect><text x="336" y="57" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0d0d0d">Représentation</text><text x="336" y="71" text-anchor="middle" font-size="10.5" fill="#556079">charge des équipes</text></g></g><g opacity="1"><g><rect x="246" y="112" width="180" height="46" rx="7" fill="#ffffff" stroke="#23468C" stroke-width="2"></rect><text x="336" y="133" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0d0d0d">Sélection d&#x27;action</text><text x="336" y="147" text-anchor="middle" font-size="10.5" fill="#556079">règles, puis score</text></g></g><g opacity="1"><g><rect x="14" y="112" width="180" height="46" rx="7" fill="#ffffff" stroke="#238C33" stroke-width="2"></rect><text x="104" y="133" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0d0d0d">Action</text><text x="104" y="147" text-anchor="middle" font-size="10.5" fill="#556079">ticket affecté</text></g></g><g opacity="1"><g><line x1="194" y1="59" x2="241" y2="59" stroke="#8A93A6" stroke-width="2"></line><polygon points="246,59 238,55 238,63" fill="#8A93A6"></polygon></g></g><g opacity="1"><g><line x1="336" y1="82" x2="336" y2="107" stroke="#8A93A6" stroke-width="2"></line><polygon points="336,112 340,104 332,104" fill="#8A93A6"></polygon></g></g><g opacity="1"><g><line x1="246" y1="135" x2="199" y2="135" stroke="#8A93A6" stroke-width="2"></line><polygon points="194,135 202,139 202,131" fill="#8A93A6"></polygon></g></g><g opacity="1"><g><line x1="104" y1="112" x2="104" y2="87" stroke="#E07B1A" stroke-width="2"></line><polygon points="104,82 100,90 108,90" fill="#E07B1A"></polygon></g><text x="220" y="184" text-anchor="middle" fill="#556079" font-size="12">l&#x27;action modifie l&#x27;environnement, qui est perçu de nouveau</text></g><text x="220" y="218" text-anchor="middle" fill="#0d0d0d" font-size="13">Un agent : percevoir, représenter, choisir une action, agir</text></svg>