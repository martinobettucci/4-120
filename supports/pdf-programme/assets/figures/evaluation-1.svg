<svg xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans" viewBox="0 0 440 230" role="img"><text x="20" y="26" fill="#556079" font-size="12">Routage : 1 000 messages dont on connaît la bonne file</text><g><rect x="20" y="40" width="368" height="30" fill="#238C33"></rect><text x="204" y="60" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">920 dans la bonne file</text></g><g><rect x="388" y="40" width="24" height="30" fill="#D9CF4A"></rect></g><g><rect x="412" y="40" width="8" height="30" fill="#F24141"></rect></g><g opacity="1"><text x="20" y="104" font-size="12.5" fill="#0d0d0d">Taux de routage correct : 920 / 1 000</text><text x="420" y="104" text-anchor="end" font-size="13" font-weight="700" fill="#0d0d0d">92 %</text></g><g opacity="1"><text x="20" y="130" font-size="12.5" fill="#0d0d0d">Taux de retour, 60 messages renvoyés par leur file</text><text x="420" y="130" text-anchor="end" font-size="13" font-weight="700" fill="#0d0d0d">6 %</text></g><g opacity="1"><text x="20" y="156" font-size="12.5" fill="#0d0d0d">Traités par une file inadaptée : 20 / 1 000</text><text x="420" y="156" text-anchor="end" font-size="13" font-weight="700" fill="#0d0d0d">2 %</text></g><text x="220" y="218" text-anchor="middle" fill="#0d0d0d" font-size="13">Un routeur se mesure sur un banc de messages étiquetés</text></svg>