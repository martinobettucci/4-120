<svg xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans" viewBox="0 0 440 230" role="img"><rect x="14" y="16" width="190" height="150" rx="8" fill="#ffffff" stroke="#8A93A6" stroke-width="2"></rect><text x="26" y="36" fill="#556079" font-size="12" font-weight="700">Courrier reçu (texte libre)</text><text x="26" y="60" font-size="12.5" fill="#0d0d0d">« Madame, Monsieur,</text><text x="26" y="80" font-size="12.5" fill="#0d0d0d">je sollicite une aide de</text><text x="26" y="100" font-size="12.5" fill="#0d0d0d">1 240 € pour rénover mon</text><text x="26" y="120" font-size="12.5" fill="#0d0d0d">logement. Facture jointe,</text><text x="26" y="140" font-size="12.5" fill="#0d0d0d">déposée le 12 octobre. »</text><line x1="210" y1="92" x2="238" y2="92" stroke="#E07B1A" stroke-width="3"></line><path d="M238 86 L248 92 L238 98 z" fill="#E07B1A"></path><text x="229" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#E07B1A">LLM</text><g opacity="1"><rect x="254" y="16" width="172" height="150" rx="8" fill="#ffffff" stroke="#23468C" stroke-width="2"></rect><text x="266" y="36" fill="#556079" font-size="12" font-weight="700">Champs extraits</text><text x="266" y="62" font-size="12.5" fill="#0d0d0d">montant : <tspan font-weight="700">1 240 €</tspan></text><text x="266" y="86" font-size="12.5" fill="#0d0d0d">catégorie : <tspan font-weight="700">rénovation</tspan></text><text x="266" y="110" font-size="12.5" fill="#0d0d0d">date : <tspan font-weight="700">12/10/2026</tspan></text><text x="266" y="134" font-size="12.5" fill="#0d0d0d">pièce jointe : <tspan font-weight="700">facture</tspan></text></g><text x="220" y="204" text-anchor="middle" fill="#0d0d0d" font-size="13">Le LLM transforme un texte libre en champs structurés</text></svg>