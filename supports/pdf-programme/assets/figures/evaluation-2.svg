<svg xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans" viewBox="0 0 440 230" role="img"><text x="20" y="26" fill="#556079" font-size="12">Arbitrage : 1 000 dossiers, trois avis par dossier</text><g><rect x="20" y="40" width="310.40000000000003" height="30" fill="#238C33"></rect><text x="175.20000000000002" y="60" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">776 accords justes</text></g><g><rect x="330.40000000000003" y="40" width="9.6" height="30" fill="#F24141"></rect></g><g><rect x="340.00000000000006" y="40" width="80" height="30" fill="#D9CF4A"></rect><text x="380.00000000000006" y="60" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0D0D0D">200</text></g><g opacity="1"><text x="20" y="104" font-size="12.5" fill="#0d0d0d">Accords unanimes : 800. Désaccords détectés</text><text x="420" y="104" text-anchor="end" font-size="13" font-weight="700" fill="#0d0d0d">200</text></g><g opacity="1"><text x="20" y="130" font-size="12.5" fill="#0d0d0d">Taux d&#x27;accord trompeur : 24 accords faux / 800</text><text x="420" y="130" text-anchor="end" font-size="13" font-weight="700" fill="#0d0d0d">3 %</text></g><g opacity="1"><text x="20" y="156" font-size="12.5" fill="#0d0d0d">Erreurs finales : 100 avec un agent seul, 40 avec arbitre</text><text x="420" y="156" text-anchor="end" font-size="13" font-weight="700" fill="#0d0d0d"></text></g><g opacity="1"><text x="20" y="182" font-size="12.5" fill="#0d0d0d">Réduction des erreurs finales : (100 - 40) / 100</text><text x="420" y="182" text-anchor="end" font-size="13" font-weight="700" fill="#0d0d0d">60 %</text></g><text x="220" y="218" text-anchor="middle" fill="#0d0d0d" font-size="13">Un accord unanime peut être faux : on le mesure aussi</text></svg>