<svg xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans" viewBox="0 0 440 230" role="img"><text x="14" y="20" fill="#556079" font-size="12">Fiche de diagnostic du moteur d&#x27;allocation de tickets</text><g><rect x="14" y="28" width="412" height="20" rx="5" fill="#e9ecf3"></rect><text x="22" y="42" font-size="11.5" font-weight="700" fill="#0d0d0d">1. Ce qu&#x27;il perçoit</text><text x="190" y="42" font-size="11.5" fill="#0d0d0d">les tickets entrants</text></g><g><rect x="14" y="52" width="412" height="20" rx="5" fill="#e9ecf3"></rect><text x="22" y="66" font-size="11.5" font-weight="700" fill="#0d0d0d">2. Comment il représente</text><text x="190" y="66" font-size="11.5" fill="#0d0d0d">la charge de chaque équipe</text></g><g><rect x="14" y="76" width="412" height="20" rx="5" fill="#e9ecf3"></rect><text x="22" y="90" font-size="11.5" font-weight="700" fill="#0d0d0d">3. Comment il décide</text><text x="190" y="90" font-size="11.5" fill="#0d0d0d">des règles, puis un score</text></g><g><rect x="14" y="100" width="412" height="20" rx="5" fill="#e9ecf3"></rect><text x="22" y="114" font-size="11.5" font-weight="700" fill="#0d0d0d">4. Sur quoi il agit</text><text x="190" y="114" font-size="11.5" fill="#0d0d0d">la file d&#x27;une équipe</text></g><g><rect x="14" y="124" width="412" height="20" rx="5" fill="#e9ecf3"></rect><text x="22" y="138" font-size="11.5" font-weight="700" fill="#0d0d0d">5. Son autonomie</text><text x="190" y="138" font-size="11.5" fill="#0d0d0d">exécution automatique sous contraintes</text></g><g><rect x="14" y="148" width="412" height="20" rx="5" fill="#e9ecf3"></rect><text x="22" y="162" font-size="11.5" font-weight="700" fill="#0d0d0d">6. Son contrôle</text><text x="190" y="162" font-size="11.5" fill="#0d0d0d">un responsable peut réaffecter</text></g><g><rect x="14" y="172" width="412" height="20" rx="5" fill="#e9ecf3"></rect><text x="22" y="186" font-size="11.5" font-weight="700" fill="#0d0d0d">7. Sa qualité</text><text x="190" y="186" font-size="11.5" fill="#0d0d0d">part des tickets bien affectés</text></g><text x="220" y="218" text-anchor="middle" fill="#0d0d0d" font-size="13">Sept questions pour diagnostiquer n&#x27;importe quel système</text></svg>