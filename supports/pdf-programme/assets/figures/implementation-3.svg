<svg xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans" viewBox="0 0 440 230" role="img"><text x="14" y="20" fill="#556079" font-size="12">Plan de test du système</text><g><rect x="14" y="28" width="412" height="24" rx="5" fill="#e9ecf3"></rect><text x="22" y="44" font-size="12" font-weight="700" fill="#0d0d0d">Règles</text><text x="118" y="44" font-size="12" fill="#0d0d0d">5 règles × 3 cas</text><text x="414" y="44" text-anchor="end" font-size="13" font-weight="700" fill="#0d0d0d">15</text></g><g><rect x="14" y="58" width="412" height="24" rx="5" fill="#e9ecf3"></rect><text x="22" y="74" font-size="12" font-weight="700" fill="#0d0d0d">Routeur</text><text x="118" y="74" font-size="12" fill="#0d0d0d">5 files + la file par défaut</text><text x="414" y="74" text-anchor="end" font-size="13" font-weight="700" fill="#0d0d0d">6</text></g><g><rect x="14" y="88" width="412" height="24" rx="5" fill="#e9ecf3"></rect><text x="22" y="104" font-size="12" font-weight="700" fill="#0d0d0d">Arbitre</text><text x="118" y="104" font-size="12" fill="#0d0d0d">2 × 2 × 2 combinaisons de trois avis</text><text x="414" y="104" text-anchor="end" font-size="13" font-weight="700" fill="#0d0d0d">8</text></g><g><rect x="14" y="118" width="412" height="24" rx="5" fill="#e9ecf3"></rect><text x="22" y="134" font-size="12" font-weight="700" fill="#0d0d0d">Bout en bout</text><text x="118" y="134" font-size="12" fill="#0d0d0d">3 décisions possibles</text><text x="414" y="134" text-anchor="end" font-size="13" font-weight="700" fill="#0d0d0d">3</text></g><line x1="330" y1="152" x2="426" y2="152" stroke="#0D0D0D" stroke-width="1.5"></line><text x="22" y="172" font-size="13" font-weight="700" fill="#0d0d0d">Total : 15 + 6 + 8 + 3</text><text x="414" y="172" text-anchor="end" font-size="15" font-weight="700" fill="#238C33">32</text><text x="220" y="218" text-anchor="middle" fill="#0d0d0d" font-size="13">32 cas de test, écrits avant la mise en service</text></svg>