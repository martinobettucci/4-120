#8A93A6" stroke-width="2"></line><polygon points="352,86 344,82 344,90" fill="#8A93A6"></polygon></g></g><g opacity="1"><g><rect x="352" y="60" width="78" height="52" rx="7" fill="#ffffff" stroke="#F24141" stroke-width="2"></rect><text x="391" y="84" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0d0d0d">Modération</text><text x="391" y="98" text-anchor="middle" font-size="10.5" fill="#556079">règles</text></g></g><text x="220" y="146" text-anchor="middle" fill="#556079" font-size="12">le LLM comprend la demande, il n&#x27;affecte pas le ticket</text><text x="220" y="168" text-anchor="middle" fill="#556079" font-size="12">la modération écarte ce qui sort du périmètre automatisé</text><text x="220" y="218" text-anchor="middle" fill="#0d0d0d" font-size="13">Une famille par étape, un rôle par composant</text></svg>