"260" y1="141" x2="281" y2="141" stroke="#8A93A6" stroke-width="2"></line><polygon points="286,141 278,137 278,145" fill="#8A93A6"></polygon></g><g><rect x="286" y="122" width="140" height="38" rx="7" fill="#238C33" stroke="#238C33" stroke-width="2"></rect><text x="356" y="139" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">Action</text><text x="356" y="153" text-anchor="middle" font-size="10.5" fill="#fff">la file est modifiée</text></g><text x="14" y="182" font-size="12.5" font-weight="700" fill="#238C33">agit sur son environnement, sans conversation</text></g><text x="220" y="218" text-anchor="middle" fill="#0d0d0d" font-size="13">Un agent se définit par sa capacité à agir, pas à répondre</text></svg>