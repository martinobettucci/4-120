<svg xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans" viewBox="0 0 440 230" role="img"><text x="18" y="22" font-size="11.5" font-weight="700" fill="#556079">Ticket</text><text x="62" y="22" font-size="11.5" font-weight="700" fill="#556079">Gravité</text><text x="110" y="22" font-size="11.5" font-weight="700" fill="#556079">Secteur</text><text x="160" y="22" font-size="11.5" font-weight="700" fill="#556079">Attente</text><text x="212" y="22" font-size="11.5" font-weight="700" fill="#556079">Délai</text><text x="270" y="22" font-size="11.5" font-weight="700" fill="#556079">Client</text><text x="348" y="22" font-size="11.5" font-weight="700" fill="#556079">Score</text><text x="396" y="22" font-size="11.5" font-weight="700" fill="#556079">Rang</text><g><rect x="10" y="32" width="420" height="26" rx="6" fill="#e9ecf3"></rect><text x="18" y="50" font-size="12" font-weight="700" fill="#0d0d0d">A</text><text x="62" y="50" font-size="12" font-weight="400" fill="#0d0d0d">4</text><text x="110" y="50" font-size="12" font-weight="400" fill="#0d0d0d">2</text><text x="160" y="50" font-size="12" font-weight="400" fill="#0d0d0d">1 j</text><text x="212" y="50" font-size="11" font-weight="400" fill="#0d0d0d">tenu</text><text x="270" y="50" font-size="11" font-weight="400" fill="#0d0d0d">courant</text><text x="348" y="50" font-size="13" font-weight="700" fill="#0d0d0d">17</text><text x="396" y="50" font-size="12" font-weight="700" fill="#0d0d0d">3e</text></g><g><rect x="10" y="66" width="420" height="26" rx="6" fill="#D9CF4A"></rect><text x="18" y="84" font-size="12" font-weight="700" fill="#0D0D0D">B</text><text x="62" y="84" font-size="12" font-weight="400" fill="#0D0D0D">2</text><text x="110" y="84" font-size="12" font-weight="400" fill="#0D0D0D">3</text><text x="160" y="84" font-size="12" font-weight="400" fill="#0D0D0D">5 j</text><text x="212" y="84" font-size="11" font-weight="400" fill="#0D0D0D">dépassé</text><text x="270" y="84" font-size="11" font-weight="400" fill="#0D0D0D">stratégique</text><text x="348" y="84" font-size="13" font-weight="700" fill="#0D0D0D">24</text><text x="396" y="84" font-size="12" font-weight="700" fill="#0D0D0D">1er</text></g><g><rect x="10" y="100" width="420" height="26" rx="6" fill="#e9ecf3"></rect><text x="18" y="118" font-size="12" font-weight="700" fill="#0d0d0d">C</text><text x="62" y="118" font-size="12" font-weight="400" fill="#0d0d0d">5</text><text x="110" y="118" font-size="12" font-weight="400" fill="#0d0d0d">1</text><text x="160" y="118" font-size="12" font-weight="400" fill="#0d0d0d">2 j</text><text x="212" y="118" font-size="11" font-weight="400" fill="#0d0d0d">tenu</text><text x="270" y="118" font-size="11" font-weight="400" fill="#0d0d0d">courant</text><text x="348" y="118" font-size="13" font-weight="700" fill="#0d0d0d">19</text><text x="396" y="118" font-size="12" font-weight="700" fill="#0d0d0d">2e</text></g><text x="14" y="152" fill="#556079" font-size="12">Score = 3 × gravité + 2 × secteur + 1 × jours d&#x27;attente</text><text x="14" y="170" fill="#556079" font-size="12">+ 4 si le délai contractuel est dépassé + 3 si le client est stratégique</text><text x="14" y="192" font-size="12" font-weight="700" fill="#F24141">Le ticket C, de gravité 5, passe après B, de gravité 2</text><text x="220" y="218" text-anchor="middle" fill="#0d0d0d" font-size="13">Agent heuristique : un score, puis un tri</text></svg>