<svg xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans" viewBox="0 0 440 230" role="img"><text x="14" y="22" fill="#0d0d0d" font-size="13" font-weight="700">Question : à combien l&#x27;aide est-elle plafonnée ?</text><g opacity="0.3"><rect x="14" y="36" width="270" height="24" rx="6" fill="#ffffff" stroke="#dde1ea"></rect><text x="22" y="52" font-size="11.5" fill="#0d0d0d"><tspan font-weight="700">1</tspan>  Le dossier se dépose sur le portail.</text><rect x="294" y="41" width="0" height="14" rx="4" fill="#8A93A6"></rect><text x="300" y="53" font-size="12" font-weight="700" fill="#0d0d0d">0</text></g><g opacity="1"><rect x="14" y="66" width="270" height="24" rx="6" fill="#D9CF4A" stroke="#0D0D0D"></rect><text x="22" y="82" font-size="11.5" fill="#0D0D0D"><tspan font-weight="700">2</tspan>  L&#x27;aide est plafonnée à 40 % du devis.</text><rect x="294" y="71" width="90" height="14" rx="4" fill="#238C33"></rect><text x="390" y="83" font-size="12" font-weight="700" fill="#0d0d0d">3</text></g><g opacity="0.3"><rect x="14" y="96" width="270" height="24" rx="6" fill="#ffffff" stroke="#dde1ea"></rect><text x="22" y="112" font-size="11.5" fill="#0d0d0d"><tspan font-weight="700">3</tspan>  L&#x27;aide est versée après la facture.</text><rect x="294" y="101" width="30" height="14" rx="4" fill="#8A93A6"></rect><text x="330" y="113" font-size="12" font-weight="700" fill="#0d0d0d">1</text></g><g opacity="0.3"><rect x="14" y="126" width="270" height="24" rx="6" fill="#ffffff" stroke="#dde1ea"></rect><text x="22" y="142" font-size="11.5" fill="#0d0d0d"><tspan font-weight="700">4</tspan>  Un refus peut être contesté.</text><rect x="294" y="131" width="0" height="14" rx="4" fill="#8A93A6"></rect><text x="300" y="143" font-size="12" font-weight="700" fill="#0d0d0d">0</text></g><rect x="14" y="160" width="412" height="34" rx="8" fill="#ffffff" stroke="#238C33" stroke-width="2"></rect><text x="24" y="182" font-size="12.5" font-weight="700" fill="#0d0d0d">« 40 % du devis. »  <tspan font-weight="400" fill="#556079">Source : passage 2 du règlement</tspan></text><text x="220" y="216" text-anchor="middle" fill="#0d0d0d" font-size="13">Étage 2 : générer la réponse à partir du passage</text></svg>