# Developpement : autonome et auto-alimente. Aucune variable a renseigner.
# Lancement : ./runDev.sh        Tests de bout en bout : ./runDev.sh e2e
name: ascent4130-dev
services:
  # Genere les donnees de depart : traces, donnees des animations, notebooks rendus, paquet Python.
  seed:
    build: { context: .., dockerfile: docker/Dockerfile.python, args: { TORCH_INDEX: "${TORCH_INDEX:-cpu}" } }
    volumes: ["..:/app"]
    command: ["python", "tools/seed.py", "--sans-execution"]
  jupyter:
    build: { context: .., dockerfile: docker/Dockerfile.python, args: { TORCH_INDEX: "${TORCH_INDEX:-cpu}" } }
    volumes: ["..:/app"]
    ports: ["${JUPYTER_PORT:-8888}:8888"]
    depends_on: { seed: { condition: service_completed_successfully } }
  web:
    image: node:22-slim
    working_dir: /app/web
    volumes: ["..:/app", "web_modules:/app/web/node_modules"]
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run dev"]
    ports: ["${WEB_PORT:-5173}:5173"]
    depends_on: { seed: { condition: service_completed_successfully } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      retries: 40
  # Tests unitaires Python.
  tests:
    profiles: ["tests"]
    build: { context: .., dockerfile: docker/Dockerfile.python, args: { TORCH_INDEX: "${TORCH_INDEX:-cpu}" } }
    volumes: ["..:/app"]
    working_dir: /app/python
    command: ["python", "-m", "pytest", "-q"]
  # Tests de bout en bout Playwright, avec captures JPEG et video WebM dans docs/captures.
  e2e:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /app
    volumes: ["..:/app"]
    environment: { NODE_PATH: /e2e/node_modules }
    command: ["sh", "-c", "mkdir -p /e2e && cd /e2e && npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1.63.0 >/dev/null && cd /app && node tools/e2e.cjs http://web:5173 --video"]
    depends_on: { web: { condition: service_healthy } }
volumes:
  web_modules:
